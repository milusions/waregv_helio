rest_base_url: "http://localhost:8000"

agent_instructions: |
  You are Helio, an intelligent voice assistant for an autonomous rover.

  CHECKPOINTS & LOCATIONS:
  1. When the user asks to remember a location (e.g., "remember that this is the kitchen"), call get_robot_pose first, then use set_checkpoint with the coordinates.
  2. When the user asks to navigate to a saved location, call navigate_to_checkpoint with the label name.

  ONLINE LEARNING & SKILLS:
  3. Whenever a user asks you to execute a specific errand, routine, or task, ALWAYS check available skills first using get_learned_skills.
  4. If you know the skill, follow its stored steps or execute the actions accordingly.
  5. If you DO NOT know how to run the requested errand:
     - Inform the user clearly: "I do not know how to run that errand yet."
     - Ask the user to teach you step-by-step how it should be done.
     - Leverage the conversation history to track all details the user provides.
     - Once you have gathered enough instructions and understand the sequence of actions, repeat back the summary of how to run the errand to the user.
     - Ask the user for explicit confirmation to save this errand.
     - Upon confirmation, call save_learned_skill with a descriptive name, description, and list of steps, so you can perform it automatically next time.

  NAVIGATION & SYSTEM:
  6. Use navigate_to_pose, set_initial_pose, set_system_mode, get_system_mode, abort_mission, and save_map when appropriate.
  7. Respond conversationally and do not expose raw JSON unless explicitly requested.

apis:
  - name: SET SYSTEM MODE
    purpose: Sets the rover's operating mode and the active map environment.
    url: /system/mode
    method: POST
    input_format: '{"mode": "string", "map_name": "string"}'
    output_format: '{"ok": boolean}'

  - name: GET SYSTEM MODE
    purpose: Retrieves the currently active operating mode.
    url: /system/mode
    method: GET
    input_format: '{}'
    output_format: '{"mode": "string"}'

  - name: SET INITIAL POSE
    purpose: Sets the initial localization coordinates and heading of the rover on the SLAM map.
    url: /set_initial_pose
    method: POST
    input_format: '{"x": float, "y": float, "yaw_deg": float}'
    output_format: '{"ok": boolean}'

  - name: NAVIGATE TO POSE
    purpose: Commands the rover to navigate to a single specific target location.
    url: /navigate_to_pose
    method: POST
    input_format: '{"x": float, "y": float, "yaw_deg": float}'
    output_format: '{"ok": boolean}'

  - name: FOLLOW WAYPOINTS
    purpose: Commands the rover to follow a sequential array of target coordinates.
    url: /follow_waypoints
    method: POST
    input_format: '{"waypoints": [{"x": float, "y": float, "yaw_deg": float}, ...]}'
    output_format: '{"ok": boolean}'

  - name: ABORT MISSION
    purpose: Immediately aborts the current navigation mission and stops the rover.
    url: /abort
    method: POST
    input_format: '{}'
    output_format: '{"ok": boolean}'

  - name: SAVE MAP
    purpose: Triggers a download of the current SLAM map.
    url: /map/save
    method: GET
    input_format: '?name=string'
    output_format: 'application/zip binary stream'

tool_description:
  - type: function
    function:
      name: get_checkpoints
      description: Retrieve all saved checkpoint locations from checkpoints.yaml.
      parameters: {type: object, properties: {}}

  - type: function
    function:
      name: set_checkpoint
      description: Save or update a named checkpoint location using coordinates from robot pose.
      parameters:
        type: object
        properties:
          label: {type: string}
          x: {type: number}
          y: {type: number}
          yaw_deg: {type: number}
        required: [label, x, y]

  - type: function
    function:
      name: navigate_to_checkpoint
      description: Retrieve a location from checkpoints.yaml by label and send navigate_to_pose command.
      parameters:
        type: object
        properties:
          label: {type: string}
        required: [label]

  - type: function
    function:
      name: get_learned_skills
      description: Retrieve all dynamically learned user skills and routines from learning.yaml.
      parameters: {type: object, properties: {}}

  - type: function
    function:
      name: save_learned_skill
      description: Save a newly taught user errand/skill into learning.yaml with its steps and description.
      parameters:
        type: object
        properties:
          skill_name: {type: string}
          description: {type: string}
          steps:
            type: array
            items: {type: string}
        required: [skill_name, description, steps]

  - type: function
    function:
      name: get_system_mode
      description: Retrieves the currently active operating mode.
      parameters: {type: object, properties: {}}

  - type: function
    function:
      name: set_system_mode
      description: Sets the rover's operating mode and the active map environment.
      parameters:
        type: object
        properties:
          mode: {type: string}
          map_name: {type: string}
        required: [mode, map_name]

  - type: function
    function:
      name: set_initial_pose
      description: Sets the initial localization coordinates and heading of the rover on the SLAM map.
      parameters:
        type: object
        properties:
          x: {type: number}
          y: {type: number}
          yaw_deg: {type: number}
        required: [x, y]

  - type: function
    function:
      name: navigate_to_pose
      description: Commands the rover to navigate to a single specific target location.
      parameters:
        type: object
        properties:
          x: {type: number}
          y: {type: number}
          yaw_deg: {type: number}
        required: [x, y]

  - type: function
    function:
      name: follow_waypoints
      description: Commands the rover to follow a sequential array of target coordinates.
      parameters:
        type: object
        properties:
          waypoints:
            type: array
            items:
              type: object
              properties:
                x: {type: number}
                y: {type: number}
                yaw_deg: {type: number}
              required: [x, y]
        required: [waypoints]

  - type: function
    function:
      name: abort_mission
      description: Immediately aborts the current navigation mission and stops the rover.
      parameters: {type: object, properties: {}}

  - type: function
    function:
      name: save_map
      description: Triggers a download of current SLAM map packaged into a .zip.
      parameters:
        type: object
        properties:
          name: {type: string}

  - type: function
    function:
      name: get_robot_pose
      description: Retrieve the rover's current physical position and heading.
      parameters: {type: object, properties: {}}