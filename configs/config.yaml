rest_base_url: "http://localhost:8000"

agent_instructions: |
  You are Helio, the intelligent voice assistant that has FULL control over an
  autonomous WareGV rover. You think like an operator: you ground every action
  in the rover's real pose, you confirm destructive or irreversible actions,
  and you never fabricate coordinates.

  ==========================================================
  CORE PRINCIPLES
  ==========================================================
  0. ALWAYS call get_robot_pose before any action that needs a location
     ("here", "this room", "the current spot", relative motions, etc.).
  1. NEVER invent x/y/yaw values. If the user does not provide coordinates
     and the action is not relative, ask which checkpoint they mean, or
     offer to save the current location as a checkpoint.
  2. Before overwriting a saved map, checkpoint, route, or skill, confirm
     with the user.
  3. Prefer high-level tools (navigate_to_checkpoint, return_to_home,
     follow_saved_route, move_forward, turn_left, …) over raw coordinates
     whenever possible.
  4. Do not dump raw JSON to the user unless explicitly asked. Speak
     conversationally, summarize state and results.

  ==========================================================
  NAVIGATION IS ASYNCHRONOUS — READ THIS FIRST
  ==========================================================
  N1. navigate_to_pose, follow_waypoints, and every motion primitive
      (move_forward, turn_left, move_relative, …) return IMMEDIATELY.
      They do NOT wait for the rover to arrive.

      The response shape is:
          { "ok": true, "status": "dispatched", "goal_id": "abc123…" }

      There is no "completed" field. "dispatched" means the rover has
      ACCEPTED the goal and is now moving. It does NOT mean it arrived.

  N2. After dispatching, tell the user the goal was accepted. Example:
          "On my way — heading to the kitchen now."
      Do NOT say "I have arrived" — you have not arrived yet.

  N3. To check progress, call get_goal_status(goal_id). The state field
      will be one of:
          "dispatched"  — sent, not yet accepted by Nav2
          "executing"   — rover is moving toward the goal
          "succeeded"   — arrived successfully
          "canceled"    — was cancelled by abort
          "aborted"     — Nav2 aborted (blocked, no path, etc.)
          "failed"      — action-level failure
          "rejected"    — Nav2 refused the goal

  N4. Polling cadence: only call get_goal_status if the user asks for
      progress, or if you are checking whether a prior goal is still
      active before dispatching a new one. Do NOT poll in a tight loop.

  N5. When the user says "are you there yet?", "did you make it?", or
      similar, call get_goal_status on the last goal_id you dispatched
      and report the answer in plain language.

  N6. When the state becomes "succeeded", confirm arrival:
          "I've arrived at the kitchen."
      When the state becomes "aborted" or "failed", apologize and offer
      to try again or pick a different target.

  N7. NEVER call navigate_to_pose in a loop to "wait" for arrival.
      That spawns conflicting goals. Dispatch once, then poll.

  N8. If the user dispatches a second navigation while the first is
      still running, the new goal will be sent on the same Nav2 action
      server — typically the first is preempted. Confirm with the user
      before replacing an active goal.

  ==========================================================
  CHECKPOINTS & LOCATIONS
  ==========================================================
  5. "Remember this place / this is the kitchen / save this spot":
       → call set_checkpoint_here(label="kitchen").
  6. "Go to the kitchen" (saved checkpoint):
       → call navigate_to_checkpoint(label="kitchen") — returns a goal_id.
  7. "Go to (x, y) facing 90 degrees":
       → call navigate_to_pose(x, y, yaw_deg) — returns a goal_id.
  8. "What places do you know?" → get_checkpoints().
  9. "Forget the kitchen" → confirm, then delete_checkpoint("kitchen").

  ==========================================================
  HOME POSITION
  ==========================================================
  10. "This is home / set home here":
        → set_home_here().
  11. "Go home / return home / come back":
        → return_to_home() — returns a goal_id.
  12. If the user says "go home" but no home has been set, tell them and
      offer to set the current pose as home.

  ==========================================================
  RELATIVE MOTION (teachable primitives)
  ==========================================================
  13. "Move forward one meter"          → move_forward(1.0)
  14. "Back up half a meter"            → move_backward(0.5)
  15. "Strafe right 30 centimeters"     → strafe_right(0.3)
  16. "Shift left 2 meters"             → strafe_left(2.0)
  17. "Turn left 90 degrees"            → turn_left(90)
  18. "Rotate 45 degrees clockwise"     → turn_right(45)
  19. Composite or custom offsets
      ("go forward 2m and 1m to the right, then face 30° left"):
        → call move_relative(forward_m=2.0, right_m=1.0, yaw_delta_deg=30)
      or chain the primitives.
  NOTE: these primitives internally fetch the live pose, apply a rigid-body
  transform, and dispatch NavigateToPose. They also return a goal_id — the
  same non-blocking rules from section N apply.

  ==========================================================
  WAYPOINT ROUTES
  ==========================================================
  20. "Patrol A → B → C" or "follow this sequence":
        - If the waypoints are saved checkpoints, translate them to
          {x, y, yaw_deg} and call follow_waypoints(waypoints=[...]).
        - If the user wants it saved for reuse:
          first save_waypoint_route(route_name, waypoints), then
          follow_saved_route(route_name).
  21. "Run the morning route" → follow_saved_route("morning_route").
  22. "What routes do you have?" → get_waypoint_routes().

  ==========================================================
  MISSION CONTROL
  ==========================================================
  23. "Stop / abort / cancel / halt" → abort_mission() (immediate).
  24. After aborting, confirm: "Stopped. All active goals cancelled."
  25. "What's running right now?" → list_goals() and describe the
      active entries in plain language.

  ==========================================================
  SYSTEM MODE & LOCALIZATION
  ==========================================================
  26. "Switch to mapping mode on map X" →
        set_system_mode(mode="mapping", map_name="X").
  27. "What mode are you in?" → get_system_mode().
  28. "Set my initial pose to (x, y, yaw)" →
        set_initial_pose(x, y, yaw_deg). Only do this when the user
      explicitly asks; it resets localization.

  ==========================================================
  MAPS
  ==========================================================
  29. "List maps" → list_maps().
  30. "Does map X exist?" → map_exists("X").
  31. "Download map X" → save_map("X"). (Streams a zip through the UI.)
  32. "Save the current map as X" →
        - Check map_exists("X"); if yes, ask before overwriting.
        - Then save_map_to_disk(name="X", pgm_bytes=..., yaml_bytes=...,
          overwrite=...). The PGM/YAML bytes usually come from the UI
          side; if the user is only talking, confirm and let the UI
          perform the upload.
  33. "Load a map from a file" → load_map(name=..., pgm_bytes=...,
        yaml_bytes=..., overwrite=...).

  ==========================================================
  ONLINE LEARNING (teaching new errands)
  ==========================================================
  34. Whenever the user asks you to run an errand, routine, or task,
      ALWAYS start with get_learned_skills() to see if you already know it.
  35. If you know the skill, execute its stored steps.
  36. If you DO NOT know how to run the requested errand:
        a. Say clearly: "I do not know how to run that errand yet."
        b. Ask the user to teach you step-by-step.
        c. Track every detail across turns in the conversation history.
        d. When you believe you understand the sequence, repeat a clear
           numbered summary back to the user.
        e. Ask for explicit confirmation.
        f. On confirmation, call save_learned_skill(skill_name,
           description, steps) with a descriptive name and a list of
           concrete steps that reference the rover's tools
           (e.g. "Call move_forward(1.0)", "Call turn_left(90)",
           "Call navigate_to_checkpoint('kitchen')").
  37. Example lesson the user may teach — moving forward one meter:
        Step 1: Call get_robot_pose() to read (x, y, yaw_deg).
        Step 2: Compute new_x = x + cos(yaw_rad) * 1.0,
                          new_y = y + sin(yaw_rad) * 1.0.
        Step 3: Call navigate_to_pose(new_x, new_y, yaw_deg).
        Step 4: (Optional) poll get_goal_status until state == "succeeded".
      In practice, you can simply call move_forward(1.0), which performs
      exactly this computation and returns a goal_id.
  38. "Forget the skill X" → confirm, then delete_learned_skill("X").

  ==========================================================
  DIAGNOSTICS
  ==========================================================
  39. If you are ever unsure of the rover's overall state,
      call describe_rover_state() — it returns pose, mode, home,
      checkpoints, routes, skills, AND active goals in one shot.

  ==========================================================
  SAFETY
  ==========================================================
  40. Never dispatch a motion goal if the rover's pose is unavailable
      (get_robot_pose returns ok=false). Instead, tell the user that
      localization is not ready and suggest set_initial_pose.
  41. For any motion that could collide (short distances, near obstacles),
      confirm intent with the user before dispatching.
  42. If the user is in the middle of giving multi-step instructions and
      a previous goal is still executing, either wait, poll for success,
      or ask the user whether to preempt the active goal.

apis:
  - name: SET SYSTEM MODE
    purpose: Sets the rover's operating mode and the active map environment.
    url: /system/mode
    method: POST
    input_format: '{"mode": "string", "map_name": "string"}'
    output_format: '{"ok": boolean, "mode": "string", "map_name": "string"}'

  - name: GET SYSTEM MODE
    purpose: Retrieves the currently active operating mode and map.
    url: /system/mode
    method: GET
    input_format: '{}'
    output_format: '{"mode": "string", "map_name": "string"}'

  - name: SET INITIAL POSE
    purpose: Publishes an initial localization pose for SLAM Toolbox.
    url: /set_initial_pose
    method: POST
    input_format: '{"x": float, "y": float, "yaw_deg": float}'
    output_format: '{"ok": boolean, "pose_source": "tf:map->base_link"}'

  - name: NAVIGATE TO POSE (async)
    purpose: >
      Dispatches a Nav2 NavigateToPose goal and returns IMMEDIATELY with
      a goal_id. The rover continues moving in the background. Poll
      GET /goal/{goal_id} to check progress.
    url: /navigate_to_pose
    method: POST
    input_format: '{"x": float, "y": float, "yaw_deg": float}'
    output_format: '{"ok": boolean, "status": "dispatched", "goal_id": "string"}'

  - name: FOLLOW WAYPOINTS (async)
    purpose: >
      Dispatches a Nav2 FollowWaypoints goal and returns IMMEDIATELY with
      a goal_id. Poll GET /goal/{goal_id} to check progress.
    url: /follow_waypoints
    method: POST
    input_format: '{"waypoints": [{"x": float, "y": float, "yaw_deg": float}, ...]}'
    output_format: '{"ok": boolean, "status": "dispatched", "goal_id": "string", "count": int}'

  - name: GET GOAL STATUS
    purpose: >
      Returns the current state of a dispatched goal. State is one of:
      dispatched, executing, succeeded, canceled, aborted, failed, rejected.
    url: /goal/{goal_id}
    method: GET
    input_format: '{}'
    output_format: >
      {"ok": boolean, "goal_id": "string", "status": "string",
       "created_at": float, "updated_at": float,
       "message": "string|null", "result": object|null, "request": object}

  - name: LIST GOALS
    purpose: Returns all active and recently finished goals.
    url: /goals
    method: GET
    input_format: '{}'
    output_format: '{"ok": boolean, "active": [...], "recent": [...]}'

  - name: ABORT MISSION
    purpose: Cancels every active Nav2 goal and stops the rover.
    url: /abort
    method: POST
    input_format: '{}'
    output_format: '{"ok": boolean, "cancelled": [string], "stopped": true}'

  - name: SAVE MAP (download)
    purpose: Streams an existing real map as a .zip archive.
    url: /map/save
    method: GET
    input_format: '?name=string'
    output_format: 'application/zip binary stream'

  - name: SAVE MAP TO DISK
    purpose: Persists a PGM (+ optional YAML) as maps/<name>/<name>.{pgm,yaml}.
    url: /map/save_to_disk
    method: POST (multipart/form-data)
    input_format: 'name, overwrite, pgm=<file>, yaml=<file optional>'
    output_format: '{"ok": boolean, "name": string, "directory": string}'

  - name: LOAD MAP
    purpose: Uploads a map (PGM + optional YAML) into the maps folder.
    url: /map/load
    method: POST (multipart/form-data)
    input_format: 'name, overwrite, pgm=<file>, yaml=<file optional>'
    output_format: '{"ok": boolean, "name": string, "directory": string}'

  - name: LIST MAPS
    purpose: Lists map names available on disk.
    url: /maps
    method: GET
    input_format: '{}'
    output_format: '{"maps": [{"name": string}], "map_directory": string}'

  - name: MAP INFO
    purpose: Returns YAML/image paths for a specific map.
    url: /maps/{map_name}
    method: GET
    input_format: '{}'
    output_format: '{"ok": boolean, "name": string, "yaml": string, "image": string}'

  - name: MAP EXISTS
    purpose: Checks whether a map name is already taken on disk.
    url: /map/exists
    method: GET
    input_format: '?name=string'
    output_format: '{"name": string, "exists": boolean}'

  - name: ROBOT POSE
    purpose: Returns the current rover pose from TF map -> base_link.
    url: /robot_pose
    method: GET
    input_format: '{}'
    output_format: '{"ok": boolean, "pose": {"position": {...}, "yaw_deg": float}}'

  - name: AMCL POSE (compat)
    purpose: Backwards-compatible endpoint; returns the same TF-based pose.
    url: /amcl_pose
    method: GET
    input_format: '{}'
    output_format: '{"ok": boolean, "pose": {...}}'

  - name: HELIO COMMAND
    purpose: Alternate conversational command entrypoint.
    url: /helio/command
    method: POST
    input_format: '{"text": string, "lang": string}'
    output_format: '{"ok": boolean, "reply": string}'

tool_description:
  # ---------------- Checkpoints ----------------
  - type: function
    function:
      name: get_checkpoints
      description: Return every saved checkpoint label and its pose.
      parameters: {type: object, properties: {}}

  - type: function
    function:
      name: set_checkpoint
      description: Save/update a named checkpoint with explicit coordinates.
      parameters:
        type: object
        properties:
          label: {type: string}
          x: {type: number}
          y: {type: number}
          yaw_deg: {type: number}
        required: [label, x, y]

  - type: function
    function:
      name: set_checkpoint_here
      description: Save the rover's CURRENT pose as a named checkpoint.
      parameters:
        type: object
        properties:
          label: {type: string}
        required: [label]

  - type: function
    function:
      name: delete_checkpoint
      description: Remove a named checkpoint.
      parameters:
        type: object
        properties:
          label: {type: string}
        required: [label]

  - type: function
    function:
      name: navigate_to_checkpoint
      description: >
        Dispatch a navigation goal to a saved checkpoint by label.
        Returns IMMEDIATELY with a goal_id. Use get_goal_status to poll.
      parameters:
        type: object
        properties:
          label: {type: string}
        required: [label]

  # ---------------- Home ----------------
  - type: function
    function:
      name: set_home_here
      description: Persist the current pose as the rover's home location.
      parameters:
        type: object
        properties:
          label: {type: string}

  - type: function
    function:
      name: get_home
      description: Return the stored home pose.
      parameters: {type: object, properties: {}}

  - type: function
    function:
      name: return_to_home
      description: >
        Dispatch a navigation goal to the stored home position.
        Returns IMMEDIATELY with a goal_id.
      parameters: {type: object, properties: {}}

  # ---------------- Waypoint routes ----------------
  - type: function
    function:
      name: get_waypoint_routes
      description: Return all saved named waypoint routes.
      parameters: {type: object, properties: {}}

  - type: function
    function:
      name: save_waypoint_route
      description: Save a named ordered route of waypoints for later reuse.
      parameters:
        type: object
        properties:
          route_name: {type: string}
          waypoints:
            type: array
            items:
              type: object
              properties:
                x: {type: number}
                y: {type: number}
                yaw_deg: {type: number}
              required: [x, y]
        required: [route_name, waypoints]

  - type: function
    function:
      name: delete_waypoint_route
      description: Remove a saved waypoint route.
      parameters:
        type: object
        properties:
          route_name: {type: string}
        required: [route_name]

  - type: function
    function:
      name: follow_saved_route
      description: >
        Execute a previously saved named waypoint route.
        Returns IMMEDIATELY with a goal_id.
      parameters:
        type: object
        properties:
          route_name: {type: string}
        required: [route_name]

  # ---------------- Learning ----------------
  - type: function
    function:
      name: get_learned_skills
      description: Return all dynamically learned user skills and routines.
      parameters: {type: object, properties: {}}

  - type: function
    function:
      name: save_learned_skill
      description: Persist a newly taught skill with description and ordered steps.
      parameters:
        type: object
        properties:
          skill_name: {type: string}
          description: {type: string}
          steps:
            type: array
            items: {type: string}
        required: [skill_name, description, steps]

  - type: function
    function:
      name: delete_learned_skill
      description: Forget a previously learned skill.
      parameters:
        type: object
        properties:
          skill_name: {type: string}
        required: [skill_name]

  # ---------------- System / pose ----------------
  - type: function
    function:
      name: get_system_mode
      description: Return the current system mode and map name.
      parameters: {type: object, properties: {}}

  - type: function
    function:
      name: set_system_mode
      description: Switch the rover's operating mode and active map.
      parameters:
        type: object
        properties:
          mode: {type: string}
          map_name: {type: string}
        required: [mode, map_name]

  - type: function
    function:
      name: set_initial_pose
      description: Publish an initial localization pose (resets SLAM localization).
      parameters:
        type: object
        properties:
          x: {type: number}
          y: {type: number}
          yaw_deg: {type: number}
        required: [x, y]

  - type: function
    function:
      name: get_robot_pose
      description: Return the rover's live pose from TF map -> base_link.
      parameters: {type: object, properties: {}}

  # ---------------- Navigation ----------------
  - type: function
    function:
      name: navigate_to_pose
      description: >
        Dispatch a Nav2 NavigateToPose goal. Returns IMMEDIATELY with a
        goal_id and status="dispatched". The rover continues moving in
        the background. Poll get_goal_status(goal_id) for progress.
      parameters:
        type: object
        properties:
          x: {type: number}
          y: {type: number}
          yaw_deg: {type: number}
        required: [x, y]

  - type: function
    function:
      name: follow_waypoints
      description: >
        Dispatch a Nav2 FollowWaypoints goal with an ordered list of poses.
        Returns IMMEDIATELY with a goal_id.
      parameters:
        type: object
        properties:
          waypoints:
            type: array
            items:
              type: object
              properties:
                x: {type: number}
                y: {type: number}
                yaw_deg: {type: number}
              required: [x, y]
        required: [waypoints]

  - type: function
    function:
      name: get_goal_status
      description: >
        Poll the status of a dispatched goal. State is one of:
        dispatched, executing, succeeded, canceled, aborted, failed,
        rejected. Use this instead of blocking on navigate_to_pose.
      parameters:
        type: object
        properties:
          goal_id: {type: string}
        required: [goal_id]

  - type: function
    function:
      name: list_goals
      description: Return all active and recently finished goals.
      parameters: {type: object, properties: {}}

  - type: function
    function:
      name: abort_mission
      description: Cancel all active Nav2 goals and stop the rover immediately.
      parameters: {type: object, properties: {}}

  - type: function
    function:
      name: stop_all
      description: Alias for abort_mission; emergency stop.
      parameters: {type: object, properties: {}}

  # ---------------- Motion primitives ----------------
  - type: function
    function:
      name: move_relative
      description: >
        Move relative to the CURRENT pose (forward/right meters and yaw
        delta). Returns IMMEDIATELY with a goal_id.
      parameters:
        type: object
        properties:
          forward_m: {type: number}
          right_m: {type: number}
          yaw_delta_deg: {type: number}

  - type: function
    function:
      name: move_forward
      description: Drive straight forward by N meters. Returns a goal_id.
      parameters:
        type: object
        properties:
          distance_m: {type: number}
        required: [distance_m]

  - type: function
    function:
      name: move_backward
      description: Reverse by N meters. Returns a goal_id.
      parameters:
        type: object
        properties:
          distance_m: {type: number}
        required: [distance_m]

  - type: function
    function:
      name: strafe_left
      description: Strafe left by N meters. Returns a goal_id.
      parameters:
        type: object
        properties:
          distance_m: {type: number}
        required: [distance_m]

  - type: function
    function:
      name: strafe_right
      description: Strafe right by N meters. Returns a goal_id.
      parameters:
        type: object
        properties:
          distance_m: {type: number}
        required: [distance_m]

  - type: function
    function:
      name: rotate_in_place
      description: Rotate in place by a signed yaw delta. Returns a goal_id.
      parameters:
        type: object
        properties:
          yaw_delta_deg: {type: number}
        required: [yaw_delta_deg]

  - type: function
    function:
      name: turn_left
      description: Rotate counter-clockwise by the given degrees (default 90).
      parameters:
        type: object
        properties:
          angle_deg: {type: number}

  - type: function
    function:
      name: turn_right
      description: Rotate clockwise by the given degrees (default 90).
      parameters:
        type: object
        properties:
          angle_deg: {type: number}

  # ---------------- Maps ----------------
  - type: function
    function:
      name: list_maps
      description: List map names available on the backend.
      parameters: {type: object, properties: {}}

  - type: function
    function:
      name: get_map_info
      description: Return YAML and image file paths for a named map.
      parameters:
        type: object
        properties:
          map_name: {type: string}
        required: [map_name]

  - type: function
    function:
      name: map_exists
      description: Return whether a map name already exists on disk.
      parameters:
        type: object
        properties:
          map_name: {type: string}
        required: [map_name]

  - type: function
    function:
      name: save_map
      description: Trigger a download of an existing map as a .zip archive.
      parameters:
        type: object
        properties:
          name: {type: string}
        required: [name]

  - type: function
    function:
      name: save_map_to_disk
      description: Upload a PGM (+ optional YAML) to persist a new map on disk.
      parameters:
        type: object
        properties:
          name: {type: string}
          pgm_bytes: {type: string, description: "Base64/bytes of the PGM image."}
          yaml_bytes: {type: string, description: "Optional YAML map metadata."}
          overwrite: {type: boolean}
        required: [name, pgm_bytes]

  - type: function
    function:
      name: load_map
      description: Upload a PGM (+ optional YAML) into the maps folder.
      parameters:
        type: object
        properties:
          name: {type: string}
          pgm_bytes: {type: string}
          yaml_bytes: {type: string}
          overwrite: {type: boolean}
        required: [name, pgm_bytes]

  # ---------------- Diagnostics ----------------
  - type: function
    function:
      name: describe_rover_state
      description: >
        Aggregate pose, mode, home, checkpoints, routes, skills, and
        currently active goals.
      parameters: {type: object, properties: {}}

  - type: function
    function:
      name: compute_pose_offset
      description: Pure math helper — compute a new pose from a relative motion.
      parameters:
        type: object
        properties:
          x: {type: number}
          y: {type: number}
          yaw_deg: {type: number}
          forward_m: {type: number}
          right_m: {type: number}
          yaw_delta_deg: {type: number}
        required: [x, y, yaw_deg]